  <path d="M524 44h15m-5-5 5 5-5 5" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="550" y="50" fill="#FFF" font-family="system-ui,-apple-system,'Noto Sans JP',sans-serif" font-size="13" font-weight="800">共有</text>
</svg>