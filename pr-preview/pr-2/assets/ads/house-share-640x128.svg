<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 128" role="img" aria-labelledby="title desc">
  <title id="title">友達にも次の便を</title>
  <desc id="desc">阪大シャトルを友達に共有するコンパクト自社広告。</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D287F"/>
      <stop offset="0.5" stop-color="#393DCD"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="638" height="126" rx="20" fill="#F7F7FF" stroke="#DFDCF4" stroke-width="2"/>
  <rect x="18" y="20" width="72" height="72" rx="18" fill="url(#brand)"/>
  <g fill="none" stroke="#FFF" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 56V47c0-11 9-20 20-20s20 9 20 20v9" stroke-width="6"/>
    <path d="M74 56v11c0 11-9 20-20 20S34 78 34 67V56" stroke-width="6"/>
    <path d="M75 56V36" stroke-width="6"/>
    <path d="M30 56h50" stroke-width="4.5"/>
  </g>
  <g fill="#FFF"><circle cx="34" cy="56" r="6"/><circle cx="54" cy="56" r="6"/><circle cx="75" cy="56" r="6"/></g>
  <text x="112" y="41" fill="#2D287F" font-family="system-ui,-apple-system,'Noto Sans JP',sans-serif" font-size="12" font-weight="800" letter-spacing="1.1">HANDAI SHUTTLE</text>
  <text x="112" y="70" fill="#171627" font-family="system-ui,-apple-system,'Noto Sans JP',sans-serif" font-size="21" font-weight="800">友達にも、次の便を。</text>
  <text x="112" y="94" fill="#6C6D7A" font-family="system-ui,-apple-system,'Noto Sans JP',sans-serif" font-size="13">便利だったら阪大シャトルを共有</text>
  <rect x="506" y="40" width="112" height="44" rx="22" fill="#2D287F"/>
  <text x="562" y="68" text-anchor="middle" fill="#FFF" font-family="system-ui,-apple-system,'Noto Sans JP',sans-serif" font-size="14" font-weight="800">共有する →</text>
  <text x="618" y="111" text-anchor="end" fill="#9292A0" font-family="system-ui,-apple-system,'Noto Sans JP',sans-serif" font-size="9">自社案内</text>
</svg>