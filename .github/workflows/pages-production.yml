name: Publish production Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: production-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0
      - name: Validate app
        run: |
          test -f source/index.html
          node --check source/src/search-engine.mjs
          node --check source/src/app.mjs
          node --check source/src/enhancements.mjs
          node --check source/src/features-v3.mjs
          node --check source/src/features-v3-core.mjs
          node --check source/src/brand-integration.mjs
          node --check source/src/brand-canvas.mjs
          node --check source/src/ui-v4.mjs
          node --check source/src/ui-v4-polish.mjs
          node --check source/src/ui-v5.mjs
          node --check source/src/ui-v9.mjs
          node --check source/src/ui-v10.mjs
          node --check source/src/ui-v11.mjs
          node --check source/src/ui-v12.mjs
          node --check source/src/ui-v13.mjs
          node --check source/src/ui-v14.mjs
          node --check source/src/ui-v15.mjs
          node --check source/src/pwa.mjs
          node --check source/src/crowding-prediction.mjs
          node --check source/src/share-card.mjs
          node --check source/src/ads.mjs
          node --check source/data/location-points.mjs
          test -f source/ads.css
          test -f source/ui-v5.css
          test -f source/ui-v7.css
          test -f source/ui-v9.css
          test -f source/src/ui-v10.css
          test -f source/src/ui-v11.css
          test -f source/src/ui-v12.css
          test -f source/src/ui-v13.css
          test -f source/src/ui-v14.css
          test -f source/src/ui-v15.css
          test -f source/assets/brand/app-icon.svg
          test -f source/assets/brand/brand-icon-rounded.svg
          test -f source/assets/brand/brand-symbol-white.svg
          test -f source/assets/brand/splash-white.webp
          test -f source/assets/brand/splash-black.webp
          test -f source/assets/brand/splash-gradient.webp
          test -f source/assets/ads/house-share-640x180.svg
          test -f source/assets/ads/house-share-640x128.svg
          test -f source/assets/help/install/ios-01-share.webp
          test -f source/assets/help/install/ios-02-add-home.webp
          test -f source/assets/help/install/ios-03-confirm.webp
          test -f source/lp/index.html
          test -f source/lp/lp.css
          node --test source/tests/*.test.mjs
      - name: Sync production while preserving PR previews
        run: |
          rm -rf pages/assets pages/data pages/src pages/lp
          rm -f pages/index.html pages/manifest.webmanifest pages/style.css pages/ui-v2.css pages/ui-v3.css pages/ui-v4.css pages/ui-v5.css pages/ui-v7.css pages/ui-v9.css pages/ads.css pages/version.json
          cp source/index.html source/manifest.webmanifest source/style.css source/ui-v2.css source/ui-v3.css source/ui-v4.css source/ui-v5.css source/ui-v7.css source/ui-v9.css source/ads.css pages/
          cp -R source/assets source/data source/src source/lp pages/
          touch pages/.nojekyll
      - name: Generate production build marker
        run: |
          python3 - <<'PY'
          import json, os
          assets = [
              "index.html", "manifest.webmanifest", "style.css", "ui-v2.css", "ui-v3.css", "ui-v4.css", "ui-v5.css", "ui-v7.css", "ui-v9.css", "ads.css",
              "src/app.mjs", "src/enhancements.mjs", "src/features-v3.mjs", "src/features-v3-core.mjs", "src/ui-v4.mjs", "src/ui-v5.mjs", "src/ui-v7-fixes.mjs", "src/ui-v9.mjs", "src/ui-v10.mjs", "src/ui-v11.mjs", "src/ui-v12.mjs", "src/ui-v13.mjs", "src/ui-v14.mjs", "src/ui-v15.mjs", "src/ui-v10.css", "src/ui-v11.css", "src/ui-v12.css", "src/ui-v13.css", "src/ui-v14.css", "src/ui-v15.css", "src/pwa.mjs", "src/ads.mjs",
              "assets/brand/app-icon.svg", "assets/brand/brand-icon-rounded.svg", "assets/brand/brand-symbol-white.svg", "assets/brand/splash-white.webp", "assets/brand/splash-black.webp", "assets/brand/splash-gradient.webp", "assets/help/install/ios-01-share.webp", "assets/help/install/ios-02-add-home.webp", "assets/help/install/ios-03-confirm.webp"
          ]
          with open("pages/version.json", "w", encoding="utf-8") as handle:
              json.dump({"build": os.environ["GITHUB_SHA"], "assets": assets}, handle, separators=(",", ":"))
          PY
      - name: Publish
        run: |
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish production site"
          for attempt in 1 2 3; do
            git pull --rebase origin gh-pages
            if git push origin HEAD:gh-pages; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
