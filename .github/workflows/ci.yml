name: Validate app

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript and tests
        run: |
          node --check src/search-engine.mjs
          node --check src/app.mjs
          node --check src/enhancements.mjs
          node --check src/features-v3.mjs
          node --check src/features-v3-core.mjs
          node --check src/brand-integration.mjs
          node --check src/brand-canvas.mjs
          node --check src/ui-v4.mjs
          node --check src/ui-v4-polish.mjs
          node --check src/ui-v5.mjs
          node --check src/route-preferences.mjs
          node --check src/ui-v10.mjs
          node --check src/ui-v11.mjs
          node --check src/ui-v12.mjs
          node --check src/ui-v13.mjs
          node --check src/ui-v14.mjs
          node --check src/ui-v15.mjs
          node --check src/ui-current.mjs
          node --check src/pwa.mjs
          node --check src/crowding-prediction.mjs
          node --check src/share-card.mjs
          node --check src/ads.mjs
          node --check data/location-points.mjs
          test -f ads.css
          test -f ui-v4.css
          test -f ui-v5.css
          test -f src/ui-v10.css
          test -f src/ui-v11.css
          test -f src/ui-v12.css
          test -f src/ui-v13.css
          test -f src/ui-v14.css
          test -f src/ui-v15.css
          test -f src/ui-current.css
          test -f assets/brand/app-icon.svg
          test -f assets/brand/brand-icon-rounded.svg
          test -f assets/brand/brand-symbol-white.svg
          test -f assets/brand/splash-white.webp
          test -f assets/brand/splash-black.webp
          test -f assets/brand/splash-gradient.webp
          test -f assets/ads/house-share-640x180.svg
          test -f assets/ads/house-share-640x128.svg
          test -f assets/help/install/ios-01-share.webp
          test -f assets/help/install/ios-02-add-home.webp
          test -f assets/help/install/ios-03-confirm.webp
          node --test tests/*.test.mjs
