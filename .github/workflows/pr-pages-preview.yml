name: Deploy PR Pages preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate source tree
        run: |
          test -f index.html
          test -f src/features-v3.mjs
          test -f src/ui-system.css
          test -f assets/brand/app-icon-32.png
          test -f assets/brand/app-icon-180.png
          test -f assets/help/install/ios-01-share.webp
          test -f assets/help/install/ios-02-add-home.webp
          test -f assets/help/install/ios-03-confirm.webp
          node --check src/features-v3.mjs
          node --check src/ui-v6.mjs
          node --check src/pwa.mjs
          node --check src/ui-v12.mjs
          node --check src/ui-v13.mjs

      - name: Build preview payload
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          rm -rf source
          mkdir -p source
          cp index.html manifest.webmanifest style.css ui-v2.css ui-v4.css ads.css source/
          cp -R src data assets source/
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('source')
          pr = os.environ.get('PR_NUMBER', '').strip()
          production = 'https://naoshi-git.github.io/handai-shuttle/'
          if pr:
              preview = f'https://naoshi-git.github.io/handai-shuttle/pr-preview/pr-{pr}/'
              index = root / 'index.html'
              text = index.read_text(encoding='utf-8').replace(production, preview)
              index.write_text(text, encoding='utf-8')

          allowed = {'.html','.css','.js','.mjs','.json','.webmanifest','.svg','.png','.webp','.jpg','.jpeg'}
          assets = sorted(
              str(path.relative_to(root)).replace('\\','/')
              for path in root.rglob('*')
              if path.is_file() and path.suffix.lower() in allowed
          )
          meta = {'build': os.environ['BUILD_SHA'], 'assets': assets}
          (root / 'version.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Publish PR preview to gh-pages
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "PR_NUMBER is required for PR preview deployment"
            exit 1
          fi
          git fetch origin gh-pages || true
          rm -rf public
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add public origin/gh-pages
          else
            git worktree add --detach public
            cd public
            git checkout --orphan gh-pages
            git rm -rf . || true
            cd ..
          fi
          mkdir -p "public/pr-preview/pr-${PR_NUMBER}"
          rm -rf "public/pr-preview/pr-${PR_NUMBER:?}"/*
          cp -R source/. "public/pr-preview/pr-${PR_NUMBER}/"
          cd public
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "Preview already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy PR ${PR_NUMBER} preview ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
