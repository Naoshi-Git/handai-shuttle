name: Deploy PR Pages preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  deployments: write

concurrency:
  group: pr-pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PREVIEW_PATH: pr-preview/pr-${{ github.event.pull_request.number }}
  PREVIEW_URL: https://naoshi-git.github.io/handai-shuttle/pr-preview/pr-${{ github.event.pull_request.number }}/

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment:
      name: pr-preview-${{ github.event.pull_request.number }}
      url: ${{ env.PREVIEW_URL }}
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0
      - name: Validate app
        run: |
          node --check source/src/search-engine.mjs
          node --check source/src/app.mjs
          node --check source/src/enhancements.mjs
          node --check source/src/features-v3.mjs
          node --check source/src/features-v3-core.mjs
          node --check source/src/brand-integration.mjs
          node --check source/src/brand-canvas.mjs
          node --check source/src/ui-v4.mjs
          node --check source/src/ui-v4-polish.mjs
          node --check source/src/ui-v5.mjs
          node --check source/src/route-preferences.mjs
          node --check source/src/ui-v12.mjs
          node --check source/src/ui-v13.mjs
          node --check source/src/ui-current.mjs
          node --check source/src/pwa.mjs
          node --check source/src/crowding-prediction.mjs
          node --check source/src/share-card.mjs
          node --check source/src/ads.mjs
          node --check source/data/location-points.mjs
          test -f source/ads.css
          test -f source/ui-v5.css
          test -f source/src/ui-v10.css
          test -f source/src/ui-v11.css
          test -f source/src/ui-v12.css
          test -f source/src/ui-v13.css
          test -f source/src/ui-v14.css
          test -f source/src/ui-v15.css
          test -f source/src/ui-current.css
          test -f source/assets/brand/app-icon.svg
          test -f source/assets/brand/brand-icon-rounded.svg
          test -f source/assets/brand/brand-symbol-white.svg
          test -f source/assets/brand/splash-white.webp
          test -f source/assets/brand/splash-black.webp
          test -f source/assets/brand/splash-gradient.webp
          test -f source/assets/ads/house-share-640x180.svg
          test -f source/assets/ads/house-share-640x128.svg
          test -f source/assets/help/install/ios-01-share.webp
          test -f source/assets/help/install/ios-02-add-home.webp
          test -f source/assets/help/install/ios-03-confirm.webp
          test -f source/lp/index.html
          test -f source/lp/lp.css
          node --test source/tests/*.test.mjs
      - name: Prepare preview
        run: |
          rm -rf "pages/${PREVIEW_PATH}"
          mkdir -p "pages/${PREVIEW_PATH}"
          cp source/index.html source/manifest.webmanifest source/style.css source/ui-v2.css source/ui-v3.css source/ui-v4.css source/ui-v5.css source/ads.css "pages/${PREVIEW_PATH}/"
          cp -R source/assets source/data source/src source/lp "pages/${PREVIEW_PATH}/"
          touch pages/.nojekyll
      - name: Generate preview build manifest
        env:
          BUILD_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_DIR: pages/${{ env.PREVIEW_PATH }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          root = os.environ["TARGET_DIR"]
          allowed = {".html", ".css", ".js", ".mjs", ".json", ".webmanifest", ".svg", ".png", ".webp"}
          assets = []
          for base, _, files in os.walk(root):
              for name in files:
                  path = os.path.join(base, name)
                  rel = os.path.relpath(path, root).replace(os.sep, "/")
                  if rel == "version.json":
                      continue
                  if os.path.splitext(name)[1].lower() in allowed or name == "manifest.webmanifest":
                      assets.append(rel)
          payload = {
              "build": os.environ["BUILD_SHA"],
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "assets": sorted(assets),
          }
          with open(os.path.join(root, "version.json"), "w", encoding="utf-8") as handle:
              json.dump(payload, handle, ensure_ascii=False, separators=(",", ":"))
          PY
      - name: Publish preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Deploy preview for PR #${PR_NUMBER}"
          for attempt in 1 2 3; do
            git pull --rebase origin gh-pages
            if git push origin HEAD:gh-pages; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
      - name: Preview address
        run: |
          echo "App: ${PREVIEW_URL}"
          echo "LP: ${PREVIEW_URL}lp/"

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Remove preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          rm -rf "pr-preview/pr-${PR_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove preview for PR #${PR_NUMBER}"
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
